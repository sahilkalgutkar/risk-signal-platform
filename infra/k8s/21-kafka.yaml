# Local kind only — a single-broker KRaft Deployment, same shape as the
# docker-compose kafka service. Delete this file and point ConfigMap's
# KAFKA_BOOTSTRAP_SERVERS at MSK for EKS; for a real in-cluster HA cluster,
# use the Strimzi operator instead of hand-rolling broker manifests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: risk-signal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.1
          ports:
            - containerPort: 19092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:19092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              # localhost, not the kafka Service — broker and controller are the same process
              # here, and routing self-registration through the Service creates a deadlock: the
              # Service only forwards to Ready pods, but this pod can't become Ready until that
              # registration succeeds. docker-compose doesn't have this failure mode (container
              # DNS there isn't readiness-gated), which is why this only broke in Kubernetes.
              value: "1@localhost:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          readinessProbe:
            exec:
              # kafka-broker-api-versions.sh boots a JVM per invocation — the 1s default exec
              # probe timeout kills it before it can even connect, which reads as a probe
              # failure but is really just "didn't finish in time."
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:19092"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: risk-signal
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 19092
      targetPort: 19092
