# Non-secret configuration shared across all three services.
# On AWS, DB_HOST points at RDS for MySQL and KAFKA_BOOTSTRAP_SERVERS points
# at MSK, instead of the in-cluster mysql/kafka used here for a local kind
# cluster — see the root README's AWS deployment notes.
#
# DB_NAME is deliberately NOT here — each service falls back to its own
# per-service default (transactions/risk_scoring/alerts, see each
# application.yml). One shared database would collide on Flyway's schema
# history: every service's migration starts at V1 with different SQL, so
# the second service to boot would fail Flyway's checksum validation
# against the first service's V1. See infra/mysql/init.sql for the
# docker-compose equivalent of this database-per-service split.
apiVersion: v1
kind: ConfigMap
metadata:
  name: risk-signal-config
  namespace: risk-signal
data:
  SPRING_PROFILES_ACTIVE: "docker"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_USER: "risksignal"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
