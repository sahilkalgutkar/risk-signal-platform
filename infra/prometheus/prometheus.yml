global:
  scrape_interval: 10s

scrape_configs:
  - job_name: transaction-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["transaction-api:8081"]

  - job_name: risk-scoring-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["risk-scoring-service:8082"]

  - job_name: alert-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["alert-service:8083"]
