filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      templates:
        - condition:
            contains:
              docker.container.labels.risksignal.logs: "json"
          config:
            - type: container
              paths:
                - "/var/lib/docker/containers/${data.docker.container.id}/*.log"
              json.keys_under_root: true
              json.add_error_key: true

processors:
  - add_docker_metadata: ~

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "risk-signal-platform-%{+yyyy.MM.dd}"

setup.template.name: "risk-signal-platform"
setup.template.pattern: "risk-signal-platform-*"
setup.ilm.enabled: false

logging.level: info
